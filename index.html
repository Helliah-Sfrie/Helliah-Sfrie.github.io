<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/b733b7bca9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css" />
    <title>Krystel Portfolio</title>
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full bg-gray-800 bg-opacity-90 hidden" id="nav-bg">
        <div class="w-full max-w-7xl mx-auto flex justify-between items-center py-4 px-6">
            <div id="header-name" class="text-3xl font-bold text-transparent bg-gradient-to-r from-blue-500 to-green-400 bg-clip-text"></div>
            <nav>
                <ul id="header-links" class="flex space-x-8"></ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <!-- Sections dynamically populated by script.js -->
    </main>

    <!-- Footer -->
    <footer class="py-6 bg-gray-900 text-center">
        <p>&copy; 2024</p>
    </footer>

    <!-- Use ES6 Modules -->
    <script type="module" src="javascript/script.js"></script>
</body>
</html>
